<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="login-body">
  <main class="login-wrapper">
    <div class="login-card">
      <h1>Área Administrativa</h1>
      <p class="subtitle">Faça login para acessar as informações</p>

      <div class="field-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="xxxxx@xxxxxx.com" />
      </div>

      <div class="field-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Sua senha" />
      </div>

      <button id="loginBtn" class="primary-btn full-btn">Entrar</button>
      <p id="loginMessage" class="status-message"></p>

      <a href="index.html" class="back-link">← Voltar ao cardápio</a>
    </div>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>

</html>
